
name: Attendance System CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///./ci.db
      EMAIL_MODE: console

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff==0.17.0

      - name: Run Ruff lint
        run: ruff check app tests

      - name: Check Python formatting
        run: ruff format --check app tests

      - name: Run backend tests
        run: python -m pytest tests/ -v

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build


  deploy-local:
    name: Deploy to Local Docker
    runs-on: [self-hosted, Linux, X64]
    needs: [backend, frontend, publish-api]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and update API container
        working-directory: /home/hi/central-attendance-system
        run: |
          docker compose pull api
          docker compose up -d --no-build --no-deps api

      - name: Verify API health
        run: |
          for i in {1..12}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "API health check failed"
          exit 1

      - name: Log out from GHCR
        if: always()
        run: docker logout ghcr.io

  publish-api:
    name: Build and Publish API Image
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
